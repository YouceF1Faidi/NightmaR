<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NightmaR</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* خلفية داكنة بتدرج بنفسجي */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(160deg, #000000, #1a002b, #000000);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* شريط التنقل */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
            color: #c48aff;
            text-shadow: 0 0 10px rgba(196, 138, 255, 0.3);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #e4d3ff;
            font-size: 17px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #c48aff;
        }

        /* أيقونة ديسكورد في الهيدر */
        .discord-nav-icon {
            font-size: 22px;
            color: #5865F2; /* لون ديسكورد الرسمي */
            transition: 0.3s;
        }

        .discord-nav-icon:hover {
            color: #c48aff;
            transform: scale(1.1);
        }

        /* قسم الترحيب */
        .hero {
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h2 {
            font-size: 48px;
            margin-bottom: 5px;
            color: #c48aff;
            text-shadow: 0 0 15px rgba(196, 138, 255, 0.4);
        }

        .hero p {
            font-size: 20px;
            max-width: 600px;
            opacity: 0.8;
            line-height: 1.6;
        }

        /* أزرار الأقسام */
        .sections {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sec-btn {
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            border: 2px solid #c48aff;
            background: transparent;
            color: #e4d3ff;
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .sec-btn:hover {
            background: #c48aff33;
            box-shadow: 0 0 15px rgba(196, 138, 255, 0.2);
        }

        /* زر الديسكورد الخاص */
        .discord-btn {
            border-color: #5865F2;
            background: rgba(88, 101, 242, 0.1);
            color: #ffffff;
        }

        .discord-btn:hover {
            background: #5865F2;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
        }

    </style>
</head>
<body>

    <nav>
        <h1>NightmaR</h1>
        <div class="nav-links">
            <a href="#">Anime</a>
            <a href="games.html">Games</a>
            <a href="about.html" target="_blank">About</a>
            <a href="https://discord.gg/ZszKJJ2n9R" target="_blank" class="discord-nav-icon" title="انضم إلى سيرفر الديسكورد">
                <i class="fab fa-discord"></i>
            </a>
        </div>
    </nav>

    <div class="hero">
        <h2>مرحبا بك في NightmaR</h2>
        <p>منصة تجمع بين عالم الأنمي وعالم الألعاب، في تصميم داكن وراقي يخلق أجواء خاصة للمحتوى الذي تحبه.</p>

        <div class="sections">
            <a href="#" class="sec-btn">Anime</a>
            <a href="games.html" class="sec-btn">Games</a>
            <a href="ضع_رابط_سيرفر_الديسكورد_هنا" target="_blank" class="sec-btn discord-btn">
                <i class="fab fa-discord"></i> Discord سيرفر
            </a>
        </div>
    </div>

</body>
</html>
